<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 152" width="1000" height="152" role="img" aria-label="Gimbal. Open-source, self-healing end-to-end testing platform. A local MCP server for autonomous test generation and a five-signal resolver that repairs broken selectors without a runtime LLM. Awardee, IIT KGP Innovation Challenge 2026."><defs><pattern id="gworkald" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#151a20" stroke-width="1"/></pattern><pattern id="mworkald" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#1d232b" stroke-width="1"/></pattern></defs><rect width="1000" height="152" rx="10" fill="#0d0f12"/><rect width="1000" height="152" rx="10" fill="url(#gworkald)"/><rect width="1000" height="152" rx="10" fill="url(#mworkald)"/><rect x="10.5" y="10.5" width="979" height="131" rx="6" fill="none" stroke="#2a3038"/><text x="32" y="68" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#565c65">01</text><text x="76" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.6" fill="#8fb4ff">TESTING INFRASTRUCTURE</text><text x="968" y="42" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.4" fill="#565c65">VIEW REPOSITORY ↗</text><text x="76" y="72" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#e8e9eb">Gimbal<tspan font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8a9099" dx="12">(formerly Axiom)</tspan></text><text x="76" y="102" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8a9099">Open-source, self-healing end-to-end testing platform. A local MCP server for autonomous test generation and a five-signal</text><text x="76" y="122" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8a9099">resolver that repairs broken selectors without a runtime LLM. Awardee, IIT KGP Innovation Challenge 2026.</text></svg>