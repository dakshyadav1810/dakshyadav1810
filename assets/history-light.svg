<text x="968" y="128" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a3a29b">Dec '25 – present</text><text x="290" y="145" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6f76">Open-source self-healing E2E testing platform (formerly Axiom). Awardee, IIT KGP Innovation Challenge '26.</text><line x1="120" y1="176" x2="278" y2="176" stroke="#c9c5b9" stroke-dasharray="2 4"/><text x="290" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#66758d">emora-health</text><text x="968" y="174" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a3a29b">May '26 – Jul '26</text><text x="290" y="191" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6f76">Credentialing infrastructure and self-healing form automation, New York. Form filling 93% faster.</text><line x1="168" y1="222" x2="278" y2="222" stroke="#c9c5b9" stroke-dasharray="2 4"/><text x="290" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#4f5b6e">tech-gymkhana</text><text x="968" y="220" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a3a29b">Jun '25 – Jun '26</text><text x="290" y="237" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6f76">Technology Coordinator. Led 6 secretaries; 4 production campus portals for 15,000+ students.</text><text x="290" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">branch  emora-health</text><line x1="120" y1="314" x2="278" y2="314" stroke="#c9c5b9" stroke-dasharray="2 4"/><text x="290" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3d4859">pale</text><text x="968" y="312" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a3a29b">Nov '25 – Apr '26</text><text x="290" y="329" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6f76">Offline-first cryptographic QR entry system for the Central Library. Gate time 2 min to 20 sec.</text><text x="290" y="364" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">branch  gimbal</text><text x="290" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">branch  pale</text><line x1="120" y1="452" x2="278" y2="452" stroke="#c9c5b9" stroke-dasharray="2 4"/><text x="290" y="450" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7a889e">wed-e</text><text x="968" y="450" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a3a29b">Apr '25 – Jul '25</text><text x="290" y="467" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6f76">Serverless AI platform. API throughput up 68%, compute cost down 65%, Recall@5 up 42%.</text><text x="290" y="502" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">branch  tech-gymkhana</text><text x="290" y="548" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">branch  wed-e</text><line x1="120" y1="590" x2="278" y2="590" stroke="#c9c5b9" stroke-dasharray="2 4"/><text x="290" y="588" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#66758d">inter-iit-13</text><text x="968" y="588" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a3a29b">Nov '24 – Dec '24</text><text x="290" y="605" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6f76">Dream11 sports analytics engine at Inter IIT Tech Meet 13.0. Gold.</text><text x="290" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">branch  inter-iit-13</text><text x="290" y="686" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3a29b">init  IIT Kharagpur, B.Tech.</text></svg>